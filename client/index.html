<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050514" />
    <meta name="description" content="Color Switch Rush — a fast, color-matching tunnel arcade game built for YouTube Playables." />
    <meta name="color-scheme" content="dark" />
    <title>Color Switch Rush</title>
    <!-- YouTube Playables SDK must load before any game code. -->
    <script src="https://www.youtube.com/game_api/v1"></script>
    <!-- THIS IS THE START OF A COMMENT BLOCK, BLOCK TO BE DELETED: Google Fonts here, example:

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    THIS IS THE END OF A COMMENT BLOCK, BLOCK TO BE DELETED -->
  </head>

  <body>
    <div id="yt-boot-shell" aria-label="Loading Color Switch Rush">
      <div class="yt-boot-grid" aria-hidden="true"></div>
      <div class="yt-boot-content">
        <div class="yt-boot-ring" aria-hidden="true"><span></span></div>
        <div class="yt-boot-wordmark">COLOR SWITCH<span>RUSH</span></div>
        <div class="yt-boot-spectrum" aria-hidden="true">
          <i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
        <div class="yt-boot-status">CALIBRATING TUNNEL</div>
        <div class="yt-boot-progress" aria-hidden="true"><span></span></div>
      </div>
    </div>
    <div id="root"></div>
    <style>
      :root { color-scheme: dark; }
      #yt-boot-shell {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: grid; place-items: center; background: #050514; color: #fff;
        font-family: "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
        isolation: isolate;
      }
      #yt-boot-shell::before, #yt-boot-shell::after {
        content: ""; position: absolute; left: -10%; right: -10%; height: 1px;
        background: linear-gradient(90deg, transparent, rgba(22,217,255,.7), transparent);
        box-shadow: 0 0 20px rgba(22,217,255,.34); opacity: .6;
        transform: rotate(-9deg);
      }
      #yt-boot-shell::before { top: 22%; }
      #yt-boot-shell::after { bottom: 18%; transform: rotate(9deg); background: linear-gradient(90deg, transparent, rgba(255,59,59,.65), transparent); }
      .yt-boot-grid {
        position: absolute; inset: 0; opacity: .22;
        background: linear-gradient(90deg, transparent 49.8%, rgba(22,217,255,.2) 50%, transparent 50.2%),
          linear-gradient(0deg, transparent 49.8%, rgba(255,255,255,.12) 50%, transparent 50.2%);
        background-size: 80px 80px; mask-image: radial-gradient(ellipse at center, #000 0%, transparent 70%);
        transform: perspective(360px) rotateX(58deg) scale(1.8) translateY(30%);
      }
      .yt-boot-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 18px; }
      .yt-boot-ring {
        width: clamp(96px, 19vw, 142px); aspect-ratio: 1; border-radius: 50%; padding: 14px;
        background: conic-gradient(#ff3b3b 0 16.66%, #ff9f1c 16.66% 33.33%, #ffd60a 33.33% 50%, #16d9ff 50% 66.66%, #5a5ce6 66.66% 83.33%, #9b51e0 83.33% 100%);
        box-shadow: 0 0 38px rgba(22,217,255,.35), 0 0 90px rgba(155,81,224,.2);
        animation: ytBootSpin 2.2s linear infinite;
      }
      .yt-boot-ring span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #080820; box-shadow: inset 0 0 28px rgba(5,5,20,.9); }
      .yt-boot-wordmark { font-size: clamp(27px, 5vw, 46px); line-height: .82; letter-spacing: .08em; font-weight: 950; text-align: center; text-shadow: 0 0 22px rgba(22,217,255,.25); }
      .yt-boot-wordmark span { display: block; margin-top: 10px; color: #9b51e0; font-size: .6em; letter-spacing: .48em; transform: translateX(.24em); }
      .yt-boot-spectrum { display: flex; gap: 9px; align-items: center; }
      .yt-boot-spectrum i { display: block; width: 10px; height: 10px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
      .yt-boot-spectrum i:nth-child(1) { color: #ff3b3b; background: #ff3b3b; }
      .yt-boot-spectrum i:nth-child(2) { color: #ff9f1c; background: #ff9f1c; }
      .yt-boot-spectrum i:nth-child(3) { color: #ffd60a; background: #ffd60a; }
      .yt-boot-spectrum i:nth-child(4) { color: #16d9ff; background: #16d9ff; }
      .yt-boot-spectrum i:nth-child(5) { color: #5a5ce6; background: #5a5ce6; }
      .yt-boot-spectrum i:nth-child(6) { color: #9b51e0; background: #9b51e0; }
      .yt-boot-status { color: rgba(255,255,255,.56); font-size: 10px; font-weight: 800; letter-spacing: .34em; }
      .yt-boot-progress { width: min(220px, 54vw); height: 3px; border: 1px solid rgba(22,217,255,.25); background: rgba(22,217,255,.08); overflow: hidden; }
      .yt-boot-progress span { display: block; width: 44%; height: 100%; background: #16d9ff; box-shadow: 0 0 14px #16d9ff; animation: ytBootLoad 1.6s ease-in-out infinite; }
      @keyframes ytBootSpin { to { transform: rotate(360deg); } }
      @keyframes ytBootLoad { 0% { transform: translateX(-120%); } 55%, 100% { transform: translateX(280%); } }
      @media (prefers-reduced-motion: reduce) { .yt-boot-ring, .yt-boot-progress span { animation: none; } }
    </style>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
